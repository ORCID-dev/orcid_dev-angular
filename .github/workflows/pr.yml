name: pr

on:
  pull_request:
  merge_group:

permissions: {}

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    permissions:
      contents: read
    uses: ORCID-dev/public-reusable-workflows/.github/workflows/lint.yml@v1

  test_yarn:
    permissions:
      contents: read
    uses: ORCID-dev/public-reusable-workflows/.github/workflows/build.yml@v1
    with:
      name: test_yarn
      node-version-file: .nvmrc
      build-cache: .angular/cache
      build-cache-key: ng-build
      run: |
        yarn test:scripts
        yarn typecheck:scripts
        yarn test-headless:ci

  format:
    permissions:
      contents: read
    uses: ORCID-dev/public-reusable-workflows/.github/workflows/build.yml@v1
    with:
      name: format
      node-version-file: .nvmrc
      run: yarn format:check

  bld_yarn:
    permissions:
      contents: read
    uses: ORCID-dev/public-reusable-workflows/.github/workflows/build.yml@v1
    with:
      name: bld_yarn
      node-version-file: .nvmrc
      build-cache: .angular/cache
      build-cache-key: ng-build
      run: |
        yarn build
        yarn build:manifest:check
        yarn build:verify
