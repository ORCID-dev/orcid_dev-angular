name: pr

on:
  pull_request:
  merge_group:

permissions: {}

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    permissions:
      contents: read
    uses: ORCID-dev/public-reusable-workflows/.github/workflows/lint.yml@v1

  test:
    permissions:
      contents: read
    uses: ORCID-dev/public-reusable-workflows/.github/workflows/build.yml@v1
    with:
      name: test
      node-version-file: .nvmrc
      build-cache: .angular/cache
      build-cache-key: ng-build
      run: |
        yarn test:scripts
        yarn typecheck:scripts
        yarn test-headless:ci

  format:
    permissions:
      contents: read
    uses: ORCID-dev/public-reusable-workflows/.github/workflows/build.yml@v1
    with:
      name: format
      node-version-file: .nvmrc
      run: yarn format:check

  build:
    permissions:
      contents: read
    uses: ORCID-dev/public-reusable-workflows/.github/workflows/build.yml@v1
    with:
      name: build
      node-version-file: .nvmrc
      build-cache: .angular/cache
      build-cache-key: ng-build
      run: |
        yarn build
        yarn build:manifest:check
        yarn build:verify

  ok:
    if: always()
    needs: [lint, test, format, build]
    permissions: {}
    uses: ORCID-dev/public-reusable-workflows/.github/workflows/gate.yml@v1
    with:
      needs: ${{ toJSON(needs) }}
